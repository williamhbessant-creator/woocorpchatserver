<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woocorp Public Chat</title>
    <link id="themeStylesheet" rel="stylesheet" href="{{ url_for('static', filename='darkstyle.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Woocorp Chat</h1>
            <button id="aiOpenButton" class="ai-open-button" type="button">🤖 AI Assistant</button>
        </header>

        <div id="chat-box"></div>

        <div class="controls">
            <input type="text" id="username" placeholder="Username" maxlength="20" autocomplete="off">
            <input type="text" id="message" placeholder="Type your message..." maxlength="500" autocomplete="off">
            <button id="sendButton" type="button">Send</button>
            <button id="themeButton" type="button">
                <img src="{{ url_for('static', filename='icons8-light-48.png') }}" alt="" class="theme-icon">
                Theme
            </button>
            <button id="clearButton" type="button">Clear Chat</button>
        </div>
    </div>

    <div id="aiOverlay" class="ai-overlay" aria-hidden="true"></div>

    <aside id="aiSidebar" class="ai-sidebar" aria-hidden="true">
        <div class="ai-header">
            <div>
                <div class="ai-title">Ask WAI</div>
                <div class="ai-status">AI assistant </div>
            </div>
            <button id="aiCloseButton" class="ai-close-button" type="button">×</button>
        </div>
        <div id="aiMessages" class="ai-messages">
            <div class="ai-message ai-message-assistant">
                <div class="ai-message-name">AI Assistant</div>
                <div>Hello! How can I help?</div>
            </div>
        </div>
        <form id="aiForm" class="ai-input-area">
            <div class="ai-input-row">
                <textarea id="aiInput" rows="1" maxlength="2000" placeholder="Ask the AI..." autocomplete="off"></textarea>
                <button id="aiSendButton" type="submit">Send</button>
            </div>
            <div id="aiUsesRemaining" class="ai-uses-remaining">Loading AI uses remaining...</div>
        </form>
    </aside>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='bulkdelete.js') }}"></script>
</body>
</html>
